[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deep_cast"
version = "1.0.0"
description = "A console based Phishing simulator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "prompt_toolkit",
    "python-dotenv",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "google-api-python-client",
    "yagmail",
    "requests",
    "keyring",
    "sendgrid",
]

[project.scripts]
dcast = "deep_cast.main:cli_entry"
dsetup = "deep_cast.setup_wizard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_cast"]